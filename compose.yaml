# Production: FileBrowser behind Traefik.
# Requires external network traefik-public and DOMAIN in .env.
# Run: docker compose up -d
# App: https://files.${DOMAIN}

services:
  filebrowser:
    image: docker.io/gtstef/filebrowser:stable
    container_name: filebrowser
    environment:
      FILEBROWSER_CONFIG: "/home/filebrowser/data/config.yaml"
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD:?FILEBROWSER_ADMIN_PASSWORD must be set}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./data:/home/filebrowser/data
      - ./files:/files
    restart: always
    # ports:
    #   - "127.0.0.1:8080:80"   # optional, local debugging only
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN:?DOMAIN must be set}`)"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.routers.filebrowser.service=filebrowser"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
      - "traefik.http.routers.filebrowser.tls=true"
      - "traefik.http.routers.filebrowser.tls.certresolver=letsencrypt"

networks:
  traefik-public:
    external: true